name: Mac Mini OpenClaw Pristracker

on:
  schedule:
    # Hver mandag kl 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Manuell kjøring

jobs:
  price-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/mac-mini-price-tracking-ccozP

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install
        working-directory: packages/mac-mini-tracker

      - name: Run price scan
        run: node src/scan-and-report.js
        working-directory: packages/mac-mini-tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: 1
          REPO_OWNER: henocksin
          REPO_NAME: flowise
