<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" fill="none" role="img" aria-label="To boksehansker">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3340"/>
      <stop offset="1" stop-color="#c1121f"/>
    </linearGradient>
    <linearGradient id="redDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d11827"/>
      <stop offset="1" stop-color="#8f0d18"/>
    </linearGradient>
    <g id="glove">
      <!-- cuff -->
      <rect x="74" y="150" width="92" height="78" rx="22" fill="url(#redDark)" stroke="#5e0a11" stroke-width="3"/>
      <rect x="74" y="150" width="92" height="22" rx="11" fill="#f5b301"/>
      <!-- laces -->
      <line x1="120" y1="182" x2="120" y2="220" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M110 190l20 9M130 190l-20 9M110 204l20 9M130 204l-20 9" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      <!-- mitt -->
      <path d="M58 110C58 56 95 26 132 26c44 0 70 35 70 78 0 37-19 60-48 64H96c-23 0-38-17-38-38Z" fill="url(#red)" stroke="#7d0d15" stroke-width="3"/>
      <!-- thumb -->
      <path d="M58 122c-16-2-23 15-16 31 6 14 20 15 28 8l3-31c-2-6-7-9-15-8Z" fill="url(#redDark)" stroke="#7d0d15" stroke-width="3"/>
      <!-- knuckle creases -->
      <path d="M150 40c9 30 9 76 0 118" stroke="#9a0f1a" stroke-width="4" stroke-linecap="round" opacity=".7"/>
      <path d="M118 32c-2 46-2 90-3 134" stroke="#9a0f1a" stroke-width="4" stroke-linecap="round" opacity=".45"/>
      <!-- highlight -->
      <ellipse cx="102" cy="68" rx="24" ry="32" fill="#ff6670" opacity=".55"/>
    </g>
  </defs>

  <!-- left glove -->
  <use href="#glove" transform="rotate(-18 150 200) translate(20 70)"/>
  <!-- right glove (mirrored) -->
  <use href="#glove" transform="translate(520 0) scale(-1 1) rotate(-18 150 200) translate(20 40)"/>
</svg>
